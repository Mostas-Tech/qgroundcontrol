syntax = "proto3";

package ihattys.v1;

option csharp_namespace = "Ihattys.V1";
option java_multiple_files = true;
option java_package = "tr.shgm.ihattys.v1";
option go_package = "ihattys/v1;ihattysv1";

// ---------- Core ----------
message SubscribeConnectionStateRequest {}

message ConnectionStateResponse {
  bool isConnected = 1; // true if UAV <-> RC/GCS link is active
}

// ---------- Telemetry ----------
message SubscribePositionRequest {}
message SubscribeAltitudeRequest {}
message SubscribeInAirRequest {}
message SubscribeAttitudeEulerRequest {}

// Position @ 10 Hz
message Position {
  // Degrees (WGS84)
  double lat    = 1;  // latitude
  double lon    = 2;  // longitude
  // Altitudes (meters)
  double alt    = 3;  // AMSL (WGS84)
  double relAlt = 4;  // relative-to-home
}

// Altitude @ 10 Hz (AMSL)
message Altitude {
  float altitudeAmslM = 1;
}

// In-air state @ 1 Hz
message InAirResponse {
  bool isInAir = 1;
}

// Attitude (Euler) @ 50 Hz
message AttitudeEulerResponse {
  float rollDeg     = 1;
  float pitchDeg    = 2;
  float yawDeg      = 3;
  int64 timestampUs = 4; // microseconds
}

// ---------- Flight Controller / GPS ----------
message SubscribeGpsInfoRequest {}

enum GpsSignalLevel {
  GPS_SIGNAL_LEVEL_UNSPECIFIED = 0;
  GPS_LEVEL_0 = 1; // no signal
  GPS_LEVEL_1 = 2;
  GPS_LEVEL_2 = 3;
  GPS_LEVEL_3 = 4;
  GPS_LEVEL_4 = 5;
  GPS_LEVEL_5 = 6; // strongest
}

message GpsInfo {
  int32 numSatellites = 1;
  GpsSignalLevel level = 2;
}

// ---------- Action ----------
message HoldRequest {}

enum ActionResultCode {
  ACTION_RESULT_UNSPECIFIED = 0;
  ACTION_SUCCESS            = 1;
  ACTION_FAILED             = 2;
  ACTION_COMMAND_DENIED     = 3;
  ACTION_TIMEOUT            = 4;
}

message ActionResult {
  ActionResultCode result = 1;
  string resultStr        = 2; // human-readable reason
}

// ---------- Arm Authorizer ----------
message SubscribeArmAuthorizationRequest {}

message ArmAuthorizationResponse {
  int32 systemid = 1; // MAVLink system id
}

message RejectArmAuthorizationRequest {
  bool   temporarily = 1;
  string reason      = 2;
  string extraInfo   = 3;
}

message AcceptArmAuthorizationRequest {
  int32 systemid     = 1;
  int32 valid_time_s = 2;
}

enum ArmAuthorizerServerResultCode {
  ARM_AUTH_RESULT_UNSPECIFIED = 0;
  ARM_AUTH_UNKNOWN            = 1;
  ARM_AUTH_SUCCESS            = 2;
  ARM_AUTH_FAILED             = 3;
}

message ArmAuthorizerServerResult {
  ArmAuthorizerServerResultCode result = 1;
  string resultStr                     = 2;
}

// ---------- Info ----------
message GetProductRequest {}
message Product {
  string vendorName  = 1;
  string productName = 2;
}

message GetIdentificationRequest {}
message Identification {
  string hardware_uid = 1;
  uint64 legacy_uid   = 2;
}

// =========================
// ======= Services ========
// =========================

service CoreService {
  rpc subscribeConnectionState(SubscribeConnectionStateRequest)
      returns (stream ConnectionStateResponse);
}

service TelemetryService {
  rpc subscribePosition(SubscribePositionRequest)
      returns (stream Position);

  rpc subscribeAltitude(SubscribeAltitudeRequest)
      returns (stream Altitude);

  rpc subscribeInAir(SubscribeInAirRequest)
      returns (stream InAirResponse);

  rpc subscribeAttitudeEuler(SubscribeAttitudeEulerRequest)
      returns (stream AttitudeEulerResponse);
}

service FlightControllerService {
  rpc subscribeGpsInfo(SubscribeGpsInfoRequest)
      returns (stream GpsInfo);
}

service ActionService {
  rpc hold(HoldRequest) returns (ActionResult);
}

service ArmAuthorizerServerService {
  rpc subscribeArmAuthorization(SubscribeArmAuthorizationRequest)
      returns (stream ArmAuthorizationResponse);

  rpc acceptArmAuthorization(AcceptArmAuthorizationRequest)
      returns (ArmAuthorizerServerResult);

  rpc rejectArmAuthorization(RejectArmAuthorizationRequest)
      returns (ArmAuthorizerServerResult);
}

service InfoService {
  rpc GetProduct(GetProductRequest) returns (Product);
  rpc GetIdentification(GetIdentificationRequest) returns (Identification);
}
